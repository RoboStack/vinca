[workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64"]
preview = ["pixi-build"]

[tasks]
test = "pytest vinca/"
fmt = "ruff format ."
fmt-check = "ruff format --check ."
lint = "ruff check --fix ."
lint-check = "ruff check ."

[dependencies]
python = ">=3.14.0,<3.15"
pytest = "*"
ruff = "*"
vinca.path = "."

[package.build]
backend.name = "pixi-build-python"
config.ignore-pypi-mapping = false