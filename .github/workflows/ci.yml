name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
    - uses: actions/checkout@v7

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@v0.10.2
      with:
        pixi-version: latest
        cache: true

    - name: Check formatting
      run: pixi run fmt-check

    - name: Run linter
      run: pixi run lint-check

    - name: Check types
      run: pixi run typecheck

    - name: Run tests
      run: pixi run test

    - name: Install Windows ROS activation test environment
      if: runner.os == 'Windows'
      run: >-
        pixi exec --spec conda -- conda env create --yes
        --prefix "${{ runner.temp }}/vinca-ros-activation"
        --file tests/windows/environment.yml

    - name: Test ROS activation with conda and Git Bash
      if: runner.os == 'Windows'
      env:
        VINCA_WINDOWS_ROS_PREFIX: ${{ runner.temp }}/vinca-ros-activation
      run: pixi run pytest -v vinca/test_windows_activation.py
